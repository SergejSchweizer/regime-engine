name: Temporary fix univariate shadow backlog

on:
  push:
    branches:
      - planning/univariate-shadow-analysis-backlog

permissions:
  contents: write

jobs:
  rewrite-backlog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite section 18 with collision-free PR IDs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("BACKLOG.md")
          current = path.read_text(encoding="utf-8")
          marker = "\n---\n\n# 18. Xetra univariate shadow-model analysis — 2026-08-27\n"
          if marker not in current:
              raise SystemExit("section 18 marker missing")

          _, tail = current.split(marker, 1)
          for old, new in {
              132: 144,
              133: 145,
              134: 146,
              135: 147,
              136: 148,
              137: 149,
              138: 150,
              139: 151,
              140: 152,
              141: 153,
              142: 154,
              143: 155,
          }.items():
              tail = tail.replace(f"PR-{old}", f"PR-{new}")

          base = subprocess.check_output(
              ["git", "show", "origin/main:BACKLOG.md"], text=True
          ).rstrip()
          rewritten = base + marker + tail

          required = (
              "vix_delta_1obs",
              "vix9d_delta_1obs",
              "vix3m_delta_1obs",
              "vix6m_delta_1obs",
              "vix1y_delta_1obs",
              "vstoxx_delta_1obs",
              "move_delta_1obs",
              "ciss_delta_1obs",
              "euro_hy_oas_delta_1obs",
              "us_2y_delta_1obs",
              "us_10y_delta_1obs",
              "estr_delta_1obs",
              "usd_broad_delta_1obs",
          )
          if any(name not in tail for name in required):
              raise SystemExit("required delta_1obs feature missing")
          if "21 * 12 = 252" not in tail:
              raise SystemExit("252-candidate cardinality missing")
          if any(f"### PR-{old} —" in tail for old in range(132, 144)):
              raise SystemExit("colliding shadow PR ID remains")
          if any(f"### PR-{new} —" not in tail for new in range(144, 156)):
              raise SystemExit("expected shadow PR ID missing")

          path.write_text(rewritten, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit backlog only
        shell: bash
        run: |
          rm -f .github/workflows/_tmp_fix_univariate_shadow_backlog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md .github/workflows/_tmp_fix_univariate_shadow_backlog.yml
          git diff --cached --check
          git diff --cached --exit-code -- . ':!BACKLOG.md' || {
            echo "Unexpected final diff outside BACKLOG.md" >&2
            exit 1
          }
          git commit -m "docs: finalize univariate shadow analysis backlog"
          git push origin HEAD:planning/univariate-shadow-analysis-backlog
