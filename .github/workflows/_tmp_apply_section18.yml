name: Temporary normalize Euro HY OAS feature name

on:
  push:
    branches:
      - planning/canonical-delta1-feature-selection

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact PostgreSQL feature name
        shell: bash
        run: |
          sed -i 's/neuro_hy_oas_delta_1obs/euro_hy_oas_delta_1obs/g' BACKLOG.md
          grep -q 'euro_hy_oas_delta_1obs' BACKLOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: normalize Euro HY OAS canonical delta feature name"
          git push origin HEAD:planning/canonical-delta1-feature-selection
