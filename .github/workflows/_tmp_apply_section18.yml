name: Temporary fix canonical delta feature typo

on:
  push:
    branches:
      - planning/canonical-delta1-feature-selection

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact Euro HY OAS feature name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('BACKLOG.md')
          text = path.read_text(encoding='utf-8')
          old = 'neuro_hy_oas_delta_1obs'
          new = 'euro_hy_oas_delta_1obs'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one typo, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md
          git diff --cached --check
          git commit -m "docs: fix Euro HY OAS canonical delta feature name"
          git push origin HEAD:planning/canonical-delta1-feature-selection
