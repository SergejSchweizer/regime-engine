name: Temporary rewrite corrected canonical delta section

on:
  push:
    branches:
      - planning/canonical-delta1-feature-selection

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite corrected section 18
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('BACKLOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n---\n# 18. Xetra canonical 61-feature selection + univariate shadow-model analysis — 2026-08-27\n'
          if marker not in text:
              raise SystemExit('canonical section 18 marker missing')
          prefix, _ = text.split(marker, 1)
          section = Path('.tmp_section18.md').read_text(encoding='utf-8')
          section = section.replace('neuro_hy_oas_delta_1obs', 'euro_hy_oas_delta_1obs')
          path.write_text(prefix.rstrip() + '\n\n' + section, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: correct Euro HY OAS canonical delta feature name"
          git push origin HEAD:planning/canonical-delta1-feature-selection
