name: Temporary backlog append

on:
  push:
    branches:
      - planning/delta1-model-metrics-backlog
    paths:
      - .github/workflows/temp-backlog-append.yml

permissions:
  contents: write

jobs:
  append-backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Append reviewed delta1 planning section to BACKLOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: planning/delta1-model-metrics-backlog
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          api = f"https://api.github.com/repos/{repository}/contents"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str) -> dict[str, object]:
              request = urllib.request.Request(
                  f"{api}/{path}?ref={branch}", headers=headers, method="GET"
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          backlog_meta = get("BACKLOG.md")
          patch_meta = get("docs/backlog/delta1_model_metrics_prs.md")
          backlog = base64.b64decode(str(backlog_meta["content"])).decode("utf-8")
          patch = base64.b64decode(str(patch_meta["content"])).decode("utf-8")

          heading = "# 19. Delta1-univariate MLflow Model Metrics — 2026-08-31"
          if heading in backlog:
              raise SystemExit(0)

          patch_lines = patch.splitlines()
          body = "\n".join(patch_lines[4:]).rstrip() + "\n"
          updated = backlog.rstrip() + "\n\n---\n" + heading + "\n\n" + body
          payload = json.dumps(
              {
                  "message": "docs(backlog): add delta1 model-metrics PRs",
                  "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                  "sha": backlog_meta["sha"],
                  "branch": branch,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"{api}/BACKLOG.md", data=payload, headers=headers, method="PUT"
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          print(result["commit"]["sha"])
          PY