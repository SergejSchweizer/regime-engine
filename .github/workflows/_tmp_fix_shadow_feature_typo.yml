name: Temporary fix shadow feature typo

on:
  push:
    branches:
      - planning/univariate-shadow-analysis-backlog

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact PostgreSQL feature name and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('BACKLOG.md')
          text = path.read_text(encoding='utf-8')
          old = 'neuro_hy_oas_delta_1obs'
          new = 'euro_hy_oas_delta_1obs'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one typo, found {text.count(old)}')
          text = text.replace(old, new)
          if old in text:
              raise SystemExit('typo remains')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/_tmp_fix_shadow_feature_typo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md .github/workflows/_tmp_fix_shadow_feature_typo.yml
          git diff --cached --check
          git commit -m "docs: fix Euro HY OAS shadow feature name"
          git push origin HEAD:planning/univariate-shadow-analysis-backlog
