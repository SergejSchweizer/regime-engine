name: Temporary PR144 contract
on:
  push:
    branches:
      - 'pr/PR-144-three-evaluation-contract'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append three-evaluation contract
        shell: bash
        run: |
          echo '' | base64 -d >> EVALUATION.md
          git rm .github/workflows/_tmp_pr144.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add EVALUATION.md
          git commit -m 'docs(PR-144-three-evaluation-contract): pin three evaluation contracts'
          git push
