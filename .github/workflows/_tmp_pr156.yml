name: Temporary PR156 patch
on:
  push:
    branches:
      - 'pr/PR-156-xetra-v3-61-feature-contract'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply contract
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          git rm .github/workflows/_tmp_pr156.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add EVALUATION.md
          git commit -m 'docs(PR-156-xetra-v3-61-feature-contract): pin v3 feature contract'
          git push
