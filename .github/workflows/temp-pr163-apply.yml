name: Temporary PR-163 contract patch

on:
  push:
    branches:
      - pr/PR-163-delta1-model-metrics-contract
    paths:
      - .github/workflows/temp-pr163-apply.yml

permissions:
  contents: write

jobs:
  apply-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Append staged contract text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: pr/PR-163-delta1-model-metrics-contract
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['GITHUB_TOKEN']
          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          api = f'https://api.github.com/repos/{repository}/contents'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              ref = urllib.parse.quote(branch, safe='')
              req = urllib.request.Request(f'{api}/{path}?ref={ref}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def text(meta):
              return base64.b64decode(str(meta['content'])).decode('utf-8')

          def put(path, body, sha, message):
              payload = json.dumps({
                  'message': message,
                  'content': base64.b64encode(body.encode('utf-8')).decode('ascii'),
                  'sha': sha,
                  'branch': branch,
              }).encode('utf-8')
              req = urllib.request.Request(f'{api}/{path}', data=payload, headers=headers, method='PUT')
              with urllib.request.urlopen(req) as response:
                  print(json.load(response)['commit']['sha'])

          targets = (
              (
                  'EVALUATION.md',
                  'docs/backlog/.temp_pr163_evaluation.md',
                  '## 19. Delta1-univariate Model Metrics diagnostics',
                  'docs(PR-163-delta1-model-metrics-contract): pin evaluation semantics',
              ),
              (
                  'PLOT_STYLE.md',
                  'docs/backlog/.temp_pr163_plot_style.md',
                  '## Delta1-univariate Model Metrics',
                  'docs(PR-163-delta1-model-metrics-contract): pin plot semantics',
              ),
          )
          for target_path, patch_path, marker, message in targets:
              target_meta = get(target_path)
              target = text(target_meta)
              if marker in target:
                  continue
              patch = text(get(patch_path))
              put(target_path, target.rstrip() + '\n' + patch, target_meta['sha'], message)
          PY
