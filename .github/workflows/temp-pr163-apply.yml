name: Temporary PR-163 contract patch

on:
  push:
    branches:
      - pr/PR-163-delta1-model-metrics-contract
    paths:
      - .github/workflows/temp-pr163-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Append delta1 Model Metrics contracts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: pr/PR-163-delta1-model-metrics-contract
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['GITHUB_TOKEN']
          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          api = f'https://api.github.com/repos/{repository}/contents'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path: str) -> dict[str, object]:
              ref = urllib.parse.quote(branch, safe='')
              req = urllib.request.Request(f'{api}/{path}?ref={ref}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def put(path: str, text: str, sha: object, message: str) -> None:
              payload = json.dumps({
                  'message': message,
                  'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                  'sha': sha,
                  'branch': branch,
              }).encode('utf-8')
              req = urllib.request.Request(
                  f'{api}/{path}', data=payload, headers=headers, method='PUT'
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              print(result['commit']['sha'])

          evaluation_meta = get('EVALUATION.md')
          evaluation = base64.b64decode(str(evaluation_meta['content'])).decode('utf-8')
          marker = '## 19. Delta1-univariate Model Metrics diagnostics'
          if marker not in evaluation:
              evaluation += r'''

---

## 19. Delta1-univariate Model Metrics diagnostics

This diagnostic contract applies only to the Xetra v3 `delta1_univariate` evaluation. A dataset is exactly one feature from the canonical ordered 13-delta tuple; a model is exactly one of the canonical 12 Xetra v3 candidate IDs. `medoid_multivariate` and `medoid_univariate` behavior, evidence and artifact layout are unchanged.

Each delta feature run owns one deterministic `model_metrics/` namespace:

```text
model_metrics/
  models/
    <candidate_id>/
      performance/
        train_loglik_per_obs
        oos_predictive_loglik_per_obs
        aic_per_train_obs
        bic_per_train_obs
        multistart_success_rate
      optimization/
        em_convergence
  comparisons/
    oos_predictive_loglik_per_obs_all_models
    em_convergence_all_models
  manifest.json
```

The five per-model performance histories retain their existing evaluation definitions. Cross-model performance comparison within one delta dataset remains OOS predictive log likelihood per observation on that evaluation's common clock. No TRAIN likelihood, EM convergence, AIC, BIC, convergence speed or other optimization diagnostic may alter within-feature statistical selection, cross-feature NMI agreement ranking, `diagnostic_feature_model_winner`, or `delta1_univariate_evaluation_champion`.

### EM convergence diagnostic

EM x-axis values are one-based completed EM iterations. The y-axis is `TRAIN log likelihood per observation`, obtained for a fold by dividing that winning start's recorded optimizer objective at each iteration by the same fold's retained TRAIN model observation count.

For one candidate, the main diagnostic contains every usable valid-fold winning-start trajectory, an across-fold median trajectory, and a 25th/75th percentile envelope. Only the winning multistart fit for a valid fold contributes. Failed starts, successful non-winning starts, invalid folds and unavailable traces do not contribute numeric points.

Iteration lengths may differ. At EM iteration `i`, the median and quantiles use only winner histories that actually contain iteration `i`. Forward fill, interpolation, extrapolation, padding, synthetic plateaus and fabricated zeros are forbidden. A candidate with no usable trace remains explicitly represented as unavailable.

The all-model EM comparison contains one across-fold median curve per canonical candidate, in canonical candidate order. It is an optimization diagnostic only and is never a model-selection or feature-selection metric. The first rollout uses existing MLflow nested runs, metric histories and artifacts; it does not fork or patch the MLflow frontend and does not introduce a second dashboard service.
'''
              put(
                  'EVALUATION.md',
                  evaluation,
                  evaluation_meta['sha'],
                  'docs(PR-163-delta1-model-metrics-contract): pin evaluation semantics',
              )

          style_meta = get('PLOT_STYLE.md')
          style = base64.b64decode(str(style_meta['content'])).decode('utf-8')
          marker = '## Delta1-univariate Model Metrics'
          if marker not in style:
              style += r'''

## Delta1-univariate Model Metrics

This section applies only to `delta1_univariate` Model Metrics artifacts.

- Every delta feature/dataset keeps all 12 canonical model identities visible in canonical order, including explicit unavailable entries.
- Per-model EM convergence plots use x-axis `EM iteration` and y-axis `TRAIN log likelihood per observation`.
- Usable fold winner trajectories are individually identifiable; the across-fold median is visually dominant and the 25th/75th percentile envelope is distinguishable without relying on color alone.
- No curve may extend beyond its recorded completed iterations. Missing tail iterations are absent rather than filled or interpolated.
- The all-model EM comparison uses one median curve per candidate in canonical candidate order and must not reorder by likelihood, AIC/BIC, convergence speed or OOS score.
- Every EM convergence title or legend must include the unambiguous qualifier `optimization diagnostic only — not model selection`.
- Candidate-unavailable cases must remain visible with a deterministic unavailable annotation/evidence rather than a fake zero line.
- The dataset-level OOS predictive-log-likelihood comparison remains a performance diagnostic; no cross-dataset raw likelihood comparison is introduced.
- Artifacts remain PNG plus SVG where vector-compatible, with deterministic manifest lineage under the feature run's `model_metrics/` namespace.
'''
              put(
                  'PLOT_STYLE.md',
                  style,
                  style_meta['sha'],
                  'docs(PR-163-delta1-model-metrics-contract): pin plot semantics',
              )
          PY
