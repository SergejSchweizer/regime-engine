name: Temporary PR158 patch
on:
  push:
    branches:
      - 'pr/PR-158-xetra-v3-profile'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Patch profile and resolution contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/market_regime_engine/profiles/config.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''        if self.profile_config_version == 1:\n            if self.gaussian_hmm.candidate_states != (2, 3, 4):\n                raise ValueError("xetra v1 Gaussian candidates must be exactly K=2,3,4")\n            if self.gmm_hmms or self.student_t_hmm is not None:\n                raise ValueError("xetra v1 supports only its immutable Gaussian candidate set")\n'''
          replacement = anchor + '''        elif self.profile_config_version in (2, 3):\n            expected_policy = f"xetra_semantic_medoid_v{self.profile_config_version}"\n            if self.feature_selection.policy_id != expected_policy:\n                raise ValueError("Xetra profile version and feature-selection policy differ")\n            if self.gaussian_hmm.candidate_states != (2, 3, 4, 5):\n                raise ValueError("Xetra v2/v3 Gaussian candidates must be exactly K=2,3,4,5")\n            expected_gmm = ((2, 2), (3, 2), (4, 2), (5, 2))\n            if gmm_identities != expected_gmm:\n                raise ValueError("Xetra v2/v3 GMM candidates must be exactly K2-K5 with M=2")\n            if self.student_t_hmm is None:\n                raise ValueError("Xetra v2/v3 requires the Student-t K2-K5 candidate family")\n        else:\n            raise ValueError("unsupported Xetra profile configuration version")\n'''
          if text.count(anchor) != 1:
              raise SystemExit('config anchor mismatch')
          p.write_text(text.replace(anchor, replacement), encoding='utf-8')

          p = Path('src/market_regime_engine/profiles/resolution.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''EXPECTED_CANDIDATE_IDS_BY_PROFILE_VERSION = {\n    1: _V1_CANDIDATE_IDS,\n    2: _V2_CANDIDATE_IDS,\n}\n_PROFILE_CONTRACTS = {1: (48, 8), 2: (48, 8)}\n''',
              '''_V3_CANDIDATE_IDS = _V2_CANDIDATE_IDS\nEXPECTED_CANDIDATE_IDS_BY_PROFILE_VERSION = {\n    1: _V1_CANDIDATE_IDS,\n    2: _V2_CANDIDATE_IDS,\n    3: _V3_CANDIDATE_IDS,\n}\n_PROFILE_CONTRACTS = {1: (48, 8), 2: (48, 8), 3: (61, 8)}\n''',
          )
          old = '''        expected_universe, expected_medoids = _PROFILE_CONTRACTS[\n            1 if len(self.original_feature_universe) == 48 else 2\n        ]\n        if (\n            len(self.original_feature_universe) != expected_universe\n            or len(set(self.original_feature_universe)) != expected_universe\n        ):\n            raise ValueError(\n                "original Xetra feature universe must contain exactly 48 unique features"\n            )\n'''
          new = '''        expected_universe = len(self.original_feature_universe)\n        expected_medoids = 8\n        if expected_universe not in {48, 61} or len(set(self.original_feature_universe)) != expected_universe:\n            raise ValueError(\n                "original Xetra feature universe must contain exactly 48 or 61 unique features"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('resolved candidate universe anchor mismatch')
          text = text.replace(old, new)
          old = '''    expected_universe, _ = _PROFILE_CONTRACTS[1 if policy.policy_id.endswith("v1") else 2]\n'''
          new = '''    policy_versions = {\n        "xetra_semantic_medoid_v1": 1,\n        "xetra_semantic_medoid_v2": 2,\n        "xetra_semantic_medoid_v3": 3,\n    }\n    try:\n        policy_version = policy_versions[policy.policy_id]\n    except KeyError as error:\n        raise ValueError("unsupported Xetra feature-selection policy") from error\n    expected_universe, _ = _PROFILE_CONTRACTS[policy_version]\n'''
          if text.count(old) != 1:
              raise SystemExit('policy validation anchor mismatch')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('src/market_regime_engine/training/candidate_grid.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''        expected_candidate_ids(1),\n        expected_candidate_ids(2),\n''',
              '''        expected_candidate_ids(1),\n        expected_candidate_ids(2),\n        expected_candidate_ids(3),\n''',
          )
          text = text.replace(
              '''        if self.profile_id != "xetra" or self.profile_config_version not in {1, 2}:\n''',
              '''        if self.profile_id != "xetra" or self.profile_config_version not in {1, 2, 3}:\n''',
          )
          p.write_text(text, encoding='utf-8')
          PY
          uvx ruff format src/market_regime_engine/profiles/config.py src/market_regime_engine/profiles/resolution.py src/market_regime_engine/training/candidate_grid.py
          git rm .github/workflows/_tmp_pr158_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/market_regime_engine/profiles/config.py src/market_regime_engine/profiles/resolution.py src/market_regime_engine/training/candidate_grid.py
          git commit -m 'feat(PR-158-xetra-v3-profile): resolve versioned v3 candidate universe'
          git push
