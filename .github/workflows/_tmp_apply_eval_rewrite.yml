name: Temporary apply evaluation backlog rewrite

on:
  push:
    branches:
      - planning/three-evaluation-implementation-structure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite backlog
        run: python _tmp_rewrite_eval_section.py
      - name: Commit backlog only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BACKLOG.md
          git commit -m "docs: refactor backlog into three evaluation implementations"
          git push
