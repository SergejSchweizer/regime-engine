name: Merge Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Verify interpreter and package pins
        run: |
          test "$(.venv/bin/python -c 'import platform; print(platform.python_version())')" = "3.14.7"
          .venv/bin/python -c 'import hmmlearn, mlflow; assert hmmlearn.__version__ == "0.3.3"; assert mlflow.__version__ == "3.15.1"'
      - name: Ruff lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Zero-legacy repository audit
        run: .venv/bin/python scripts/verify_zero_legacy.py
      - name: Dependency audit
        shell: bash
        run: |
          set +e
          .venv/bin/pip-audit -r uv.lock -f json -o dependency-audit.json
          code=$?
          set -e
          if [[ ${code} -eq 0 ]]; then
            exit 0
          fi
          .venv/bin/python .github/check_dependency_audit.py \
            dependency-audit.json .github/dependency-audit-exceptions.yml

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Strict mypy
        run: .venv/bin/mypy src/market_regime_engine

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Unit tests with coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          .venv/bin/coverage run -m pytest tests -m "not integration and not external"
          .venv/bin/python -c 'import market_regime_engine; assert market_regime_engine.__version__ == "0.1.0"'
          if compgen -G ".coverage.unit.*" > /dev/null; then
            .venv/bin/coverage combine --append --data-file=.coverage.unit .coverage.unit.*
          fi
          test -f .coverage.unit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  merge-gate:
    if: always()
    needs: [lint, type, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
      - name: Fail if any required lane failed
        env:
          LINT: ${{ needs.lint.result }}
          TYPE: ${{ needs.type.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          test "${LINT}" = success
          test "${TYPE}" = success
          test "${UNIT}" = success
      - name: Create coverage environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python coverage==7.15.4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: .
      - name: Enforce unit coverage >= 80%
        run: |
          .venv/bin/coverage report --fail-under=80
