name: Temporary apply three evaluation stats

on:
  push:
    branches:
      - planning/three-evaluation-statistics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backlog patch
        run: python .github/_tmp_plan_three_eval_stats.py
      - name: Commit backlog only
        shell: bash
        run: |
          git rm .github/_tmp_plan_three_eval_stats.py
          git rm .github/workflows/_tmp_apply_three_eval_stats.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md
          git diff --cached --check
          git commit -m "docs: require three evaluation statistics dossiers"
          git push origin HEAD:planning/three-evaluation-statistics
