name: Push Gate

on:
  push:
    branches:
      - main

concurrency:
  group: push-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Verify interpreter and package pins
        run: |
          test "$(.venv/bin/python -c 'import platform; print(platform.python_version())')" = "3.14.7"
          .venv/bin/python -c 'import hmmlearn, mlflow; assert hmmlearn.__version__ == "0.3.3"; assert mlflow.__version__ == "3.15.1"'
      - name: Ruff lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Zero-legacy repository audit
        run: .venv/bin/python scripts/verify_zero_legacy.py
      - name: Dependency audit
        shell: bash
        run: |
          set +e
          .venv/bin/pip-audit -r uv.lock -f json -o dependency-audit.json
          code=$?
          set -e
          if [[ ${code} -eq 0 ]]; then
            exit 0
          fi
          .venv/bin/python .github/check_dependency_audit.py \
            dependency-audit.json .github/dependency-audit-exceptions.yml

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Strict mypy
        run: .venv/bin/mypy src/market_regime_engine

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Unit tests with coverage
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.unit
        run: |
          .venv/bin/coverage run -m pytest -n auto tests -m "not integration and not external"
          .venv/bin/python -c 'import market_regime_engine; assert market_regime_engine.__version__ == "0.1.0"'
          if compgen -G ".coverage.unit.*" > /dev/null; then
            .venv/bin/coverage combine --append --data-file=.coverage.unit .coverage.unit.*
          fi
          test -f .coverage.unit
          .venv/bin/coverage report --data-file=.coverage.unit --fail-under=85

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Verify interpreter and package pins
        run: |
          test "$(.venv/bin/python -c 'import platform; print(platform.python_version())')" = "3.14.7"
          .venv/bin/python -c 'import hmmlearn, mlflow; assert hmmlearn.__version__ == "0.3.3"; assert mlflow.__version__ == "3.15.1"'
      - name: Hermetic integration tests
        run: .venv/bin/pytest -n auto tests -m "integration and not slow and not external"

  push-gate:
    if: always()
    needs: [lint, type, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required lane failed
        env:
          LINT: ${{ needs.lint.result }}
          TYPE: ${{ needs.type.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "${LINT}" = success
          test "${TYPE}" = success
          test "${UNIT}" = success
          test "${INTEGRATION}" = success
