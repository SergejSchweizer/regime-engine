name: Push Gate

on:
  push:
    branches:
      - "**"

concurrency:
  group: push-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Verify interpreter and package pins
        run: |
          test "$(.venv/bin/python -c 'import platform; print(platform.python_version())')" = "3.14.7"
          .venv/bin/python -c 'import hmmlearn, mlflow; assert hmmlearn.__version__ == "0.3.3"; assert mlflow.__version__ == "3.15.1"'
      - name: Ruff lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Dependency audit
        run: .venv/bin/pip-audit -r uv.lock

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Strict mypy
        run: .venv/bin/mypy src/market_regime_engine

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Unit tests with coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          .venv/bin/coverage run -m pytest tests -m "not integration and not external"
          .venv/bin/coverage run --append -c 'import market_regime_engine; assert market_regime_engine.__version__ == "0.1.0"'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          enable-cache: true
      - name: Create exact Python environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python -r uv.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Hermetic integration tests with coverage
        env:
          COVERAGE_FILE: .coverage.integration
        shell: bash
        run: |
          .venv/bin/coverage run -c 'import market_regime_engine'
          set +e
          .venv/bin/coverage run --append -m pytest tests -m "integration and not external"
          code=$?
          set -e
          if [[ ${code} -ne 0 && ${code} -ne 5 ]]; then
            exit "${code}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          if-no-files-found: error

  push-gate:
    if: always()
    needs: [lint, type, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
      - name: Fail if any required lane failed
        env:
          LINT: ${{ needs.lint.result }}
          TYPE: ${{ needs.type.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "${LINT}" = success
          test "${TYPE}" = success
          test "${UNIT}" = success
          test "${INTEGRATION}" = success
      - name: Create coverage environment
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python coverage==7.10.7
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Enforce combined coverage >= 90%
        run: |
          .venv/bin/coverage combine .coverage.unit .coverage.integration
          .venv/bin/coverage report --fail-under=90
