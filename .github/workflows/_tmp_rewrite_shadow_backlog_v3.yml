name: Temporary rewrite shadow backlog v3

on:
  push:
    branches:
      - planning/canonical-delta1-feature-selection

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite section 18 for canonical 61-feature selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('BACKLOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n---\n\n# 18. Xetra univariate shadow-model analysis — 2026-08-27\n'
          if marker not in text:
              raise SystemExit('section 18 marker missing')
          base, _ = text.split(marker, 1)

          section = r'''
---

# 18. Xetra canonical 61-feature selection + univariate shadow-model analysis — 2026-08-27

This section supersedes the earlier shadow-only treatment of the 13 one-observation deltas. The `*_delta_1obs` columns are already present in PostgreSQL and must participate in the canonical semantic-block feature selection used by the multivariate model. The historical Xetra v2 feature-selection definition is not mutated in place; a new versioned Xetra v3 policy/profile is introduced so prior hashes, MLflow runs and registered artifacts remain reproducible.

Canonical target identity:

```text
profile_id=xetra
profile_config_version=3
feature_selection_policy=xetra_semantic_medoid_v3
canonical_feature_universe_size=61
semantic_block_count=8
analysis_id=xetra_univariate_shadow_v1
analysis_role=diagnostic_only
```

The Xetra v3 model-family/K candidate universe remains exactly the same 12 candidates as v2: Gaussian HMM, two-mixture full-covariance GMM-HMM and Student-t HMM, each for K=2,3,4,5. The only intentional production-selection change introduced by this wave is the canonical feature universe/policy version and the resulting first-TRAIN selected feature set.

## Canonical 61-feature policy

The existing 48 Xetra v2 features remain in their existing order and blocks. The following 13 existing PostgreSQL columns are added exactly once to the indicated semantic block:

| Semantic block | Added canonical feature(s) |
|---|---|
| US equity volatility spot | `vix_delta_1obs` |
| US equity volatility term structure | `vix9d_delta_1obs`, `vix3m_delta_1obs`, `vix6m_delta_1obs`, `vix1y_delta_1obs` |
| Europe equity volatility | `vstoxx_delta_1obs` |
| Rates volatility | `move_delta_1obs` |
| Systemic stress | `ciss_delta_1obs` |
| Credit stress | `euro_hy_oas_delta_1obs` |
| Rates / yield curve | `us_2y_delta_1obs`, `us_10y_delta_1obs`, `estr_delta_1obs` |
| USD FX | `usd_broad_delta_1obs` |

The exact ordered delta tuple is:

```text
vix_delta_1obs
vix9d_delta_1obs
vix3m_delta_1obs
vix6m_delta_1obs
vix1y_delta_1obs
vstoxx_delta_1obs
move_delta_1obs
ciss_delta_1obs
euro_hy_oas_delta_1obs
us_2y_delta_1obs
us_10y_delta_1obs
estr_delta_1obs
usd_broad_delta_1obs
```

Stage 1 therefore runs the existing semantic-medoid logic on all 61 canonical features and may select a `*_delta_1obs` feature as the representative of its block. Stage 2 then applies the existing fixed cross-block pruning logic to the eight Stage-1 representatives. The first-fold TRAIN-only, no-economic-input, no-HMM-feedback and frozen-feature rules remain unchanged.

## Univariate shadow analysis after canonical selection

The univariate diagnostic analysis still answers two questions:

1. how much regime information is carried by each of the eight first-TRAIN Stage-1 semantic-block representatives; and
2. how much regime information is carried by each of the 13 canonical `*_delta_1obs` origin-shock features when modeled alone.

Because a delta feature may itself become a Stage-1 representative under the 61-feature policy, the executable shadow set is the deterministic ordered union of:

```text
1. eight preliminary_medoids in canonical block order
2. the exact ordered 13 delta_1obs tuple above
```

A feature that appears in both roles is evaluated once, with both roles recorded in its metadata. Therefore `shadow_feature_count` is data-dependent but deterministic for a fixed source build and selection result; the candidate count is exactly `shadow_feature_count * 12`. Duplicate HMM fits for the same feature/source/plan are forbidden.

Every one-feature analysis evaluates exactly:

```text
gaussian_hmm_k2_full
gaussian_hmm_k3_full
gaussian_hmm_k4_full
gaussian_hmm_k5_full
gmm_hmm_k2_m2_full
gmm_hmm_k3_m2_full
gmm_hmm_k4_m2_full
gmm_hmm_k5_m2_full
student_t_hmm_k2_full
student_t_hmm_k3_full
student_t_hmm_k4_full
student_t_hmm_k5_full
```

The multivariate Xetra v3 reference grid is evaluated separately on the frozen final feature set selected from the canonical 61-feature universe. Its 12 candidates are reference candidates, not shadow candidates.

## Shadow common observation clock

Cross-feature comparability requires one common diagnostic observation clock over the deterministic ordered-union shadow feature set. The canonical production source-row walk-forward plan is created first and is never changed by shadow analysis. A source row is retained as a shadow model observation if and only if every unique shadow feature is non-null and finite on that timestamp. The same mask is applied to every single-feature shadow evaluation while preserving original source timestamps and TRAIN/TEST source-row boundaries. No fill, interpolation, carry, synthesis or write-back is permitted.

If the common mask causes a fold to fall below existing minimum model TRAIN/TEST observation requirements, that fold is invalid under the existing rules. The implementation must not fall back to per-feature clocks.

## Shadow model selection and cross-feature comparison

Within each single feature, the 12 model candidates use the same Xetra v3 fit settings, multistart rules, numerical validation, TRAIN occupancy gates, causal TEST continuation, common-valid-fold support and seven-stage statistical ranking as the canonical multivariate grid. The resulting within-feature winner is named `diagnostic_feature_model_winner`; it is not a production statistical champion and cannot enter final refit, OOS publication, registry or alias logic.

There is deliberately no global cross-feature champion. OOS predictive likelihood chooses family/K only within one feature; it is not used to declare one feature globally best. Cross-feature output is descriptive and includes validity support, OOS mean/std/worst, BIC/AIC, occupancy, persistence, switches/year, confidence and entropy.

For every valid diagnostic feature winner, similarity to the canonical multivariate Xetra v3 reference champion is measured only on OOS timestamps shared by valid folds of both evaluations. Agreement support is the intersection of valid fold IDs; below `0.80` support, agreement is unavailable with an explicit reason without invalidating the feature winner.

Two label-invariant agreement diagnostics are pinned:

1. `dominant_state_nmi = 2 * I(X;Y) / (H(X) + H(Y))`, using natural logarithms and exact `1.0` when both entropies are zero.
2. `max_permutation_hard_agreement`, only for equal K, by exhaustive K! one-to-one permutations with lexicographically smallest permutation breaking exact ties. For unequal K the metric is null.

State-signature RMS distances are not used across different feature spaces.

Execution rule: all PRs below inherit section-12 clean-main/status/branch/allowed-file/full-test requirements. Agents must not combine PRs, edit `BACKLOG.md`, add economic metrics, or silently mutate Xetra v1/v2 identities.

