[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "market-regime-engine"
version = "0.1.0"
description = "Statistical market regime engine with causal full-covariance Gaussian HMM inference."
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
  "gunicorn==23.0.0",
  "hmmlearn==0.3.3",
  "matplotlib==3.10.6",
  "mlflow==3.15.1",
  "numpy==2.5.2",
  "pandas==2.3.3",
  "psycopg[binary,pool]==3.3.4",
  "pyarrow==25.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.scripts]
regime-engine = "market_regime_engine.cli:main"

[project.entry-points."mlflow.app"]
regime-engine = "market_regime_engine.mlflow_app.app:create_app"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.2",
  "types-PyYAML==6.0.12.20250822",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_regime_engine"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["market_regime_engine"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: hermetic integration test",
  "external: opt-in test requiring an external service",
]

[tool.coverage.run]
branch = true
source = ["market_regime_engine"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
